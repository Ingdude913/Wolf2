# Werewolf Plugin Messages
# All in-game messages are configurable here.
# Placeholders: {player}, {target}, {role}, {team}, {count}, {max}, {min}, {timer},
#   {phase}, {alive}, {dead}, {world}, {votes}, {reason}, {winning_team}, {seconds},
#   {ability}, {spouse1}, {spouse2}, {partner}, {names}, {state}, {path}, {error}

# --- Role names and descriptions ---
roles:
  werewolf:
    name: "Werewolf"
    description: "You are a Werewolf! During the night, right-click your armor item to transform: you get full netherite armor, a werewolf axe, and speed. Right-click again to untransform and become briefly invisible. During the day, blend in with the villagers."
    night-start: "&cNight falls! You can now use your werewolf abilities."
    night-start-2: "&7Right-click your Werewolf Armor to transform. Right-click again to untransform and go invisible briefly."
    day-start: "&eDay breaks! Hide your identity and blend in with the villagers."
  villager:
    name: "Villager"
    description: "You are a Villager! You have no special abilities. During the day, vote to eliminate suspected werewolves. Survive the nights!"
    night-start: "&9Night falls! Stay safe and hope the werewolves don't find you."
    day-start: "&eDay breaks! Discuss and vote to eliminate suspected werewolves."
  witch:
    name: "Witch"
    description: "You are a Witch! You have one bottle of poison and one bottle of heal. The poison kills a player, the heal saves a player. Once used, they are gone forever. Use them wisely during the night!"
    night-start: "&dNight falls! You may use your potions."
    day-start: "&eDay breaks! Your potions cannot be used during the day."
  seer:
    name: "Seer"
    description: "You are a Seer! You have a book that can open a GUI to check players' teams. You can only check ONE player per night, and it only shows Good or Bad team. You also have a Lamp to the Slaughter: once per night, you can swap positions with the furthest alive player. Use your knowledge wisely!"
    night-start: "&9Night falls! You may check one player's team."
    day-start: "&eDay breaks! Your seer book and lamp are no longer usable."
  hunter:
    name: "Hunter"
    description: "You are a Hunter! You play like a villager, but during the night you can select a target using your compass. If you are killed, the player you selected will die during the next day. Choose your target carefully!"
    night-start: "&6Night falls! You may select a target with your compass."
    day-start: "&eDay breaks! Your target selection is locked."
  trickster:
    name: "Trickster"
    description: "You are the Trickster! You are NOT a werewolf, but you can pretend to be one. Real werewolves see you as a teammate, but they don't know you are fake. During the night, you get the same werewolf ability items, but your axe cannot kill. Use your deception to confuse the werewolves and help the good team win!"
    night-start: "&cNight falls! The werewolves think you are one of them."
    night-start-2: "&7You receive werewolf items to blend in, but your axe is fake and cannot kill."
    day-start: "&eDay breaks! Your deception items are removed."
  ninja:
    name: "Ninja"
    description: "You are a Ninja! Each night, use your ability book to choose one of four abilities: Vanish (become invisible for a short time), Sprint (run very fast for a short time), Decoy (spawn a fake copy of yourself), or Disguise (appear as a fake wolf that won't show on the wolf team list). Then right-click your Ninja Orb to activate the chosen ability. You can only use ONE ability per night, and each lasts only a few seconds. Choose wisely!"
    night-start: "&5Night falls! Use your Ninja Book to select an ability, then use the Ninja Orb to activate it."
    day-start: "&eDay breaks! Your ninja abilities are no longer available."
  mermaid:
    name: "Mermaid"
    description: "You are a Mermaid! Each night, you can sing once to freeze the werewolves in place, preventing them from moving for a period of time. Use your Conch Shell during the night to sing. Choose the right moment to protect the village!"
    night-start: "&bNight falls! You may sing once to freeze the werewolves in place."
    day-start: "&eDay breaks! Your conch shell is silent."
  masochist:
    name: "Masochist"
    description: "You are the Masochist! You can vote during the day, but your votes are invalid and do not count. Your goal is to receive the MOST votes during a daytime vote. If you are the most-voted player when the day vote ends, you win and the game is over! Act suspicious and make people vote for you!"
    night-start: "&9Night falls! Survive the night so you can be voted tomorrow."
    day-start: "&eDay breaks! Act suspicious and make people vote for you! Your own votes do not count."
  cupid:
    name: "Cupid"
    description: "You are Cupid! On the first night, use your Bow of Love to select two players to become spouses. You may also select yourself as one of the spouses. When one spouse dies, the other dies immediately of a broken heart. Both spouses are revealed in chat when paired. You and your spouse must both stay alive to win together!"
    night-start: "&dNight falls! Use your Bow of Love to select two players as spouses."
    night-start-paired: "&dNight falls! You have already paired your spouses."
    day-start: ""

