# Werewolf Plugin Configuration

# Minimum players required to start a game
min-players: 4

# Day phase duration in seconds
day-duration: 120

# Night phase duration in seconds
night-duration: 60

# Ability cooldowns in seconds (for reusable abilities)
transform-cooldown: 10
ninja-cooldown: 15

# Mermaid freeze duration in seconds (how long werewolf kills are blocked after singing)
mermaid-freeze-duration: 15

# Sheriff election duration in seconds (after roles assigned, before first night)
election-duration: 30

# Lobby (waiting) duration in seconds after minimum players reached
lobby-duration: 30

# Whether to use the world's natural day/night cycle (false = force time)
use-natural-time: false

# Messages prefix
prefix: "&8[&cWerewolf&8] &r"

# Role distribution weights (higher = more likely)
role-weights:
  werewolf: 1
  villager: 1
  witch: 1
  seer: 1
  hunter: 1
  trickster: 1
  ninja: 1
  mermaid: 1
  masochist: 1

